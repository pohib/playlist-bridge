{% if page.has_other_pages %}
<nav class="admin-pagination" aria-label="Страницы">
  {% if page.has_previous %}
    <a href="?page={{ page.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key|urlencode }}={{ value|urlencode }}{% endif %}{% endfor %}">← Назад</a>
  {% endif %}
  <span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a href="?page={{ page.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key|urlencode }}={{ value|urlencode }}{% endif %}{% endfor %}">Вперёд →</a>
  {% endif %}
</nav>
{% endif %}
