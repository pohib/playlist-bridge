map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Prefer Cloudflare's edge-supplied address for the optional tunnel workflow.
# The direct Caddy deployment strips client-supplied CF headers and overwrites X-Real-IP.
map $http_cf_connecting_ip $trusted_client_ip {
    default $http_cf_connecting_ip;
    ""      $http_x_real_ip;
}

map $trusted_client_ip $client_ip {
    default $trusted_client_ip;
    ""      $remote_addr;
}

# Resolve the fixed Compose service name dynamically when Docker recreates web.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream django_backend {
    zone django_backend 64k;
    server web:8000 resolve;
}

log_format proxy_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$client_ip","request":"$request",'
    '"status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"http_user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout proxy_json;
    error_log /dev/stderr warn;
    client_max_body_size 50m;
    server_tokens off;
    error_page 404 /_errors/404.html;

    location = /_errors/404.html {
        internal;
        alias /usr/share/nginx/html/404.html;
    }

    # Never expose dotfiles, repository metadata, deployment files or source directories.
    location ~* ^/(?:\.git(?:/|$)|\.env(?:$|\.)|\.svn(?:/|$)|\.hg(?:/|$)|\.ht(?:access|passwd)$|\.DS_Store$|config(?:/|$)|scripts(?:/|$)|reports(?:/|$)|(?:manage\.py|Dockerfile|compose\.ya?ml|requirements(?:-dev)?\.txt|pyproject\.toml|pytest\.ini|README\.md|TESTING\.md))$ {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        # Public application reverse proxy: external requests must reach Django.
        proxy_pass http://django_backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
