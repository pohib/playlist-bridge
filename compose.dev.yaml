# Development overlay. Keep compose.yaml as the production-like/Quick Tunnel stack.
# Start with: docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  web:
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8002,http://localhost:8002,http://127.0.0.1:8000,http://localhost:8000
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_SSL_REDIRECT: "false"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8002:8000"

  worker:
    volumes:
      - .:/app

