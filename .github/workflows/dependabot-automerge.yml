name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-passing-dependabot-pr:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge Dependabot PR after every CI job passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_data=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open --json number,author)
          pr_number=$(jq -r '[.[] | select(.author.login == "dependabot[bot]")] | first | .number // empty' <<< "$pr_data")
          if [[ -z "$pr_number" ]]; then
            echo "No open Dependabot PR found for $HEAD_BRANCH."
            exit 0
          fi
          gh pr merge "$pr_number" --squash
