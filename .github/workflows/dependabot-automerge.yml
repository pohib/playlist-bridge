name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for required CI jobs and enable auto-merge
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor","version-update:semver-major","security-update:semver-patch","security-update:semver-minor","security-update:semver-major"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          required_checks=(tests sast-sca-secrets container dast)
          for attempt in $(seq 1 90); do
            checks=$(gh api "repos/$REPOSITORY/commits/$PR_HEAD_SHA/check-runs")
            all_passed=true
            for name in "${required_checks[@]}"; do
              status=$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | last | .status // "missing"' <<< "$checks")
              conclusion=$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | last | .conclusion // ""' <<< "$checks")
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "Required check $name finished with conclusion: $conclusion"
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_passed=false
              fi
            done
            if [[ "$all_passed" == "true" ]]; then
              gh pr merge --auto --squash "$PR_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for required CI jobs."
          exit 1
