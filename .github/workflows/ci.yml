name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django system checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - name: Tests
        run: pytest -q --cov=transfer --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

  sast-sca-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bandit SAST (SARIF report)
        if: always()
        run: bandit -r config transfer -x 'transfer/tests/*.py,transfer/test*.py,transfer/tests.py' -f sarif -o bandit.sarif -l --exit-zero
      - name: Enforce Bandit findings
        if: always()
        run: bandit -r config transfer -x 'transfer/tests/*.py,transfer/test*.py,transfer/tests.py' -l
      - name: Semgrep SAST (SARIF report)
        if: always()
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.186.0 semgrep scan --config p/security-audit --config p/owasp-top-ten --sarif --output /src/semgrep.sarif /src
      - name: Enforce Semgrep findings
        if: always()
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.186.0 semgrep scan --config p/security-audit --config p/owasp-top-ten --error /src
      - name: Python dependency audit
        if: always()
        run: pip-audit -r requirements-dev.txt
      - name: Gitleaks full Git history scan
        if: always()
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --exit-code 1 --report-format sarif --report-path /repo/gitleaks.sarif /repo
      - name: Trivy filesystem SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
      - name: Trivy filesystem enforcement
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
      - name: Upload Bandit findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload Semgrep findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Gitleaks findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload Trivy findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: docker build -t vk-to-spotify:ci .
      - name: Validate Nginx reverse-proxy configuration
        run: |
          grep -Fq 'resolver 127.0.0.11 valid=10s ipv6=off;' nginx/default.conf
          grep -Fq 'upstream django_backend {' nginx/default.conf
          grep -Fq 'server web:8000 resolve;' nginx/default.conf
          grep -Fq 'proxy_pass http://django_backend;' nginx/default.conf
          ! grep -Fq 'proxy_pass http://          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/errors/404.html:/usr/share/nginx/html/404.html:ro" \
            nginxinc/nginx-unprivileged:1.28-alpine nginx -t
      - name: Verify packaged setuptools versions
        run: |
          docker run --rm --entrypoint sh vk-to-spotify:ci -c '
            python -c "import setuptools; print(\"active setuptools:\", setuptools.__version__, setuptools.__file__)"
            find /usr/local/lib /usr/lib -type f -path "*setuptools*dist-info/METADATA" -print
            test -z "$(find /usr/local/lib/python3.12/site-packages -maxdepth 1 -type d -name "setuptools-70.*.dist-info" -print -quit)"
            dpkg-query -W -f="${Status} ${Version}\\n" python3-setuptools 2>/dev/null || true
          '
      - name: Trivy image SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vk-to-spotify:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Trivy image enforcement
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vk-to-spotify:ci
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Upload Trivy image findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

  # Authenticated OWASP ZAP scans run after tests and container validation.
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tests, container]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Validate DAST helper scripts
        run: |
          bash -n scripts/security/dast_auth_check.sh
          python -m py_compile scripts/security/dast_bootstrap.py
      - name: Prepare DAST environment
        run: |
          mkdir -p reports "$RUNNER_TEMP/zap-reports"
          chmod 777 reports "$RUNNER_TEMP/zap-reports"
          DAST_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$DAST_PASSWORD"
          echo "DAST_PASSWORD=$DAST_PASSWORD" >> "$GITHUB_ENV"
      - name: Prepare integration environment
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-secret
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          POSTGRES_PASSWORD=ci-db-password
          SESSION_COOKIE_SECURE=false
          CSRF_COOKIE_SECURE=false
          EOF
      - name: Start application stack
        run: |
          if ! docker compose up -d --build; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Create isolated DAST users and IDOR fixtures
        run: |
          docker compose exec -T -e DAST_PASSWORD="$DAST_PASSWORD" web python manage.py shell -c "exec(open('scripts/security/dast_bootstrap.py').read())"
      - name: Verify authenticated access control and prepare ZAP session
        run: bash scripts/security/dast_auth_check.sh http://127.0.0.1:8000 "$DAST_PASSWORD" "$RUNNER_TEMP/zap-reports"
      - name: Run OWASP ZAP authenticated full DAST scan
        id: zap_full
        continue-on-error: true
        run: |
          docker run --rm --network=host -v "$PWD/.zap:/zap/config:ro" -v "$RUNNER_TEMP/zap-reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:2.17.0 zap-full-scan.py -t http://127.0.0.1:8000 -c /zap/config/rules.tsv -m 5 -j -J zap-full-report.json -r zap-full-report.html -w zap-full-report.md -z "-configfile /zap/wrk/zap-auth.conf"
      - name: Run OWASP ZAP authenticated API DAST scan
        id: zap_api
        continue-on-error: true
        run: |
          docker run --rm --network=host -v "$PWD/.zap:/zap/config:ro" -v "$RUNNER_TEMP/zap-reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:2.17.0 zap-api-scan.py -t http://127.0.0.1:8000/api/v1/openapi.json -f openapi -c /zap/config/rules.tsv -I -J zap-api-report.json -r zap-api-report.html -w zap-api-report.md -z "-configfile /zap/wrk/zap-auth.conf"
      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-authenticated-dast
          path: ${{ runner.temp }}/zap-reports/zap-*-report.*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce DAST scan results
        if: always()
        env:
          FULL_SCAN_OUTCOME: ${{ steps.zap_full.outcome }}
          API_SCAN_OUTCOME: ${{ steps.zap_api.outcome }}
        run: |
          if [ "$FULL_SCAN_OUTCOME" != "success" ] || [ "$API_SCAN_OUTCOME" != "success" ]; then
            echo "Authenticated OWASP ZAP scan failed: full=$FULL_SCAN_OUTCOME api=$API_SCAN_OUTCOME"
            echo "Review the uploaded reports to distinguish security findings from scanner errors."
            exit 1
          fi
      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
