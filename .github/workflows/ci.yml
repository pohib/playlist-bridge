name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django system checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - name: Tests
        run: pytest -q
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

  sast-sca-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bandit SAST (SARIF report)
        if: always()
        run: bandit -r config transfer -f sarif -o bandit.sarif -l --exit-zero
      - name: Enforce Bandit findings
        if: always()
        run: bandit -r config transfer -l
      - name: Semgrep SAST (SARIF report)
        if: always()
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --sarif --output semgrep.sarif
      - name: Enforce Semgrep findings
        if: always()
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --error
      - name: Python dependency audit
        if: always()
        run: pip-audit -r requirements-dev.txt
      - name: Gitleaks full Git history scan
        if: always()
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --exit-code 1 /repo
      - name: Trivy filesystem SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
      - name: Trivy filesystem enforcement
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
      - name: Upload Bandit findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload Semgrep findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Trivy findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vk-to-spotify:ci .
      - name: Trivy image SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vk-to-spotify:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
      - name: Trivy image enforcement
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vk-to-spotify:ci
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
      - name: Upload Trivy image findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  dast:
    runs-on: ubuntu-latest
    needs: [tests, container]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare integration environment
        run: |
          printf 'DJANGO_SECRET_KEY=ci-only-secret\nDJANGO_DEBUG=false\nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\nPOSTGRES_PASSWORD=ci-db-password\nSESSION_COOKIE_SECURE=false\nCSRF_COOKIE_SECURE=false\n' > .env
      - name: Start application stack
        run: |
          if ! docker compose up -d --build; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          fail_action: true
          cmd_options: "-I"
          allow_issue_writing: false
      - if: always()
        run: docker compose down -v
