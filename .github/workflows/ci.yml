name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . --fix
          ruff check .
      - name: Django system checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - name: Tests
        run: pytest -q
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

  sast-sca-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bandit SAST (SARIF)
        run: bandit -r config transfer -f sarif -o bandit.sarif -ll --exit-zero
      - run: pip-audit -r requirements.txt
      - name: Semgrep SAST (SARIF)
        run: semgrep scan --config p/python --sarif --output semgrep.sarif
      - name: Upload Bandit findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload Semgrep findings to Code Scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --exit-code 1 /repo
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vk-to-spotify:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vk-to-spotify:ci
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  dast:
    runs-on: ubuntu-latest
    needs: [tests, container]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare integration environment
        run: |
          printf 'DJANGO_SECRET_KEY=ci-only-secret\nDJANGO_DEBUG=true\nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\nPOSTGRES_PASSWORD=ci-db-password\n' > .env
      - name: Start application stack
        run: |
          if ! docker compose up -d --build; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          fail_action: true
          cmd_options: "-I"
          allow_issue_writing: false
      - if: always()
        run: docker compose down -v
