name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . --fix
          ruff check .
      - name: Django system checks
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - name: Tests
        run: pytest -q
        env:
          DJANGO_SECRET_KEY: ci-only-test-key
          DJANGO_DEBUG: "true"
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

  sast-sca-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: bandit -r config transfer -ll
      - run: pip-audit -r requirements.txt
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/python
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vk-to-spotify:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vk-to-spotify:ci
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  dast:
    runs-on: ubuntu-latest
    needs: [tests, container]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare integration environment
        run: |
          printf 'DJANGO_SECRET_KEY=ci-only-secret\nDJANGO_DEBUG=true\nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\nPOSTGRES_PASSWORD=ci-db-password\n' > .env
      - name: Start application stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          fail_action: true
          allow_issue_writing: false
      - if: always()
        run: docker compose down -v
